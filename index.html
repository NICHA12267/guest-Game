<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Jeu de Devinette - Mode 21</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container" id="gameBox">
        <h2>Nombre Secret</h2>
        <p class="subtitle">Devinez le nombre entre 0 et 21 inclus</p>
        <div class="input-group">
            <input type="number" id="userGuess" placeholder="?" min="0" max="21">
            <button onclick="jouer()" id="btnJouer">Essayer</button>
        </div>
        <p id="feedback">La machine a choisi son nombre...</p>
        <p id="steps"></p>
        <button id="btnRestart" class="hidden" onclick="location.reload()">Rejouer</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
